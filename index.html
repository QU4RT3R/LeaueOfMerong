<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메롤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 메롤: 칼바람 다리 위에 차린 점술 테이블. 위쪽 운명 띠, 가운데에 카드가 깔리는 무대, 끝은 전적표 한 장 */
  --abyss:#091115;
  --deck:#0f1b20;
  --frost:#e4eef0;
  --mist:#8fa5ab;
  --foil:#d6b26a;
  --tide:#6fb8c6;
  --blood:#d46b5c;
  --line:rgba(214,178,106,.22);
  --font-display:"Hahmlet","Noto Serif KR","AppleMyungjo","Batang",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--frost);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(1100px 560px at 50% -12%,rgba(111,184,198,.17),transparent 62%),
  radial-gradient(900px 480px at 50% 118%,rgba(214,178,106,.09),transparent 60%),
  linear-gradient(180deg,#0b171c 0%,var(--abyss) 55%,#060c0f 100%)}
#wind{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.topbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:rgba(9,17,21,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-family:var(--font-display);font-weight:900;font-size:24px;letter-spacing:.02em;line-height:1;background:none;border:0;color:var(--frost);padding:0}
.fan-tag{font-size:12px;font-weight:600;color:var(--foil);border:1px solid rgba(214,178,106,.45);padding:2px 9px;border-radius:999px;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:12px}
.record{font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums;white-space:nowrap}
.shell{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 20px 32px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid rgba(228,238,240,.18);background:rgba(23,42,49,.72);color:var(--frost);font-weight:600;text-decoration:none;transition:background .2s,border-color .2s,transform .15s,filter .2s}
.btn:hover:not(:disabled){border-color:rgba(228,238,240,.42);background:#172a31}
.btn.primary{background:linear-gradient(180deg,#e6c582,#b8914a);color:#1b1407;border-color:#f1d89e;box-shadow:0 10px 26px -12px rgba(214,178,106,.75)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);background:linear-gradient(180deg,#e6c582,#b8914a)}
.btn.big{padding:14px 28px;font-size:17px}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn kbd{font-family:inherit;font-size:11px;opacity:.65;border:1px solid currentColor;border-radius:4px;padding:0 5px}
:focus-visible{outline:2px solid var(--tide);outline-offset:3px}
.eyebrow{margin:0 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--foil)}
.sub,.muted{color:var(--mist)}
.center{text-align:center}
h1,h2,h3,h4{text-wrap:balance}
.screen{padding:8px 0 24px;min-height:62vh}
.screen-head{margin:34px 0 0}
.screen-head h2{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4vw,40px);margin:0;line-height:1.2}
.screen-head .sub{margin:8px 0 0}

/* 타이틀 */
.title-screen{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding-top:52px}
.mega{font-family:var(--font-display);font-weight:900;font-size:clamp(96px,15vw,176px);line-height:1.02;padding-bottom:.04em;margin:0;letter-spacing:-.02em;color:#eef7f8;background:linear-gradient(180deg,#f6fcfd 18%,#93c4ce 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.fan-line{display:inline-block;margin:18px 0 0;font-size:15px;font-weight:700;color:#1b1407;background:var(--foil);padding:3px 12px;border-radius:6px;letter-spacing:.03em}
.lede{max-width:33em;color:#b9cacd;margin:20px 0 28px;font-size:16.5px}
.title-facts{display:flex;gap:26px;flex-wrap:wrap;margin:30px 0 0;padding:0;list-style:none;color:var(--mist);font-size:13px}
.title-facts b{display:block;color:var(--frost);font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.2}
.showcase{position:relative;height:400px}
.showcase .aug-card{position:absolute;width:222px;top:24px;left:50%;min-height:300px}
.showcase .aug-card:nth-child(1){transform:translateX(-118%) translateY(34px) rotate(-9deg)}
.showcase .aug-card:nth-child(2){transform:translateX(-50%);z-index:2}
.showcase .aug-card:nth-child(3){transform:translateX(18%) translateY(34px) rotate(9deg)}

/* 운명 띠 */
.fate{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;padding:10px 14px;margin:22px 0 4px;border:1px solid var(--line);border-radius:14px;background:rgba(15,27,32,.78)}
.fate b{font-weight:700}
.fate small{color:var(--mist);font-size:12px;margin-left:4px}
.fate-tarot,.fate-champ{display:flex;align-items:center;gap:10px}
.mini-tarot{display:inline-grid;place-items:center;width:26px;height:40px;border-radius:4px;background:linear-gradient(180deg,#f1e7cf,#d6c193);color:#3b2d13;font-family:var(--font-display);font-weight:800;font-size:11px;box-shadow:inset 0 0 0 2px #efe3c5,inset 0 0 0 3px #8a6d33}
.mini-tarot.rev{transform:rotate(180deg)}
.fate-slots{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.slot{display:inline-flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border-radius:999px;border:1px dashed rgba(228,238,240,.22);font-size:13px;color:var(--mist);min-height:36px}
.slot:not(.filled){padding-left:12px}
.slot.filled{border-style:solid;border-color:rgba(228,238,240,.14);color:var(--frost);background:rgba(23,42,49,.85)}

/* 증강 카드 */
.tier-silver{--t:#bac6cd;--t-line:rgba(186,198,205,.5);--t-glow:rgba(186,198,205,.3)}
.tier-gold{--t:#e6b95c;--t-line:rgba(230,185,92,.6);--t-glow:rgba(230,185,92,.42)}
.tier-prism{--t:#efe7ff;--t-line:transparent;--t-glow:rgba(176,156,255,.45)}
.aug-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:26px}
.tier-title{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,4.4vw,44px);margin:0;line-height:1.1;color:var(--t)}
.tier-title.tier-prism{background:linear-gradient(90deg,#8fe3ff,#ffe08a,#ff9ab8,#b8a6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.aug-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:20px}
.aug-card{position:relative;display:flex;flex-direction:column;gap:10px;padding:22px 20px 18px;border-radius:16px;background:linear-gradient(180deg,rgba(28,48,56,.97),rgba(12,22,27,.99));border:1px solid var(--t-line);box-shadow:0 24px 50px -28px var(--t-glow),inset 0 1px 0 rgba(255,255,255,.06);min-height:270px}
.aug-card.tier-prism::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--spin),#8fe3ff,#ffe08a,#ff9ab8,#b8a6ff,#8fe3ff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite;pointer-events:none}
@keyframes spin{to{--spin:360deg}}
.aug-tier{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--t)}
.aug-card h3{font-family:var(--font-display);font-weight:800;font-size:22px;margin:0;line-height:1.25}
.aug-card .desc{margin:0;color:#c8d5d8;font-size:14.5px;flex:1}
.card-actions{display:flex;gap:8px;margin-top:4px}
.card-actions .pick{flex:1}
.special{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;color:#1b1407;background:var(--foil);padding:2px 9px;border-radius:999px}
.aug-icon{position:relative;display:inline-grid;place-items:center;width:58px;height:58px;flex:none;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:linear-gradient(160deg,var(--t),#26363c 120%);color:#0c1418;font-family:var(--font-display);font-weight:900;font-size:22px;overflow:hidden}
.aug-icon.tier-prism{background:conic-gradient(from 200deg,#8fe3ff,#ffe08a,#ff9ab8,#b8a6ff,#8fe3ff)}
.aug-icon.sm{width:30px;height:30px;font-size:13px}
.aug-icon.xs{width:22px;height:22px;font-size:10px}
.hint{color:var(--mist);font-size:13px;margin:16px 0 0;text-align:center}
.deal{animation:deal .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{transform:translateY(18px) rotate(-1.2deg);opacity:0}to{transform:none;opacity:1}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid rgba(228,238,240,.14);background:rgba(23,42,49,.75)}
.chip.rule{border-color:rgba(214,178,106,.6);color:#f2ddb0}
.chip.empty{opacity:.55}

/* 그림 자리 */
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.art.ok{opacity:1}
.portrait{position:relative;display:inline-grid;place-items:center;width:56px;height:56px;flex:none;border-radius:12px;overflow:hidden;background:linear-gradient(150deg,var(--rc),#0b1418 135%);color:rgba(255,255,255,.93);font-family:var(--font-display);font-weight:900;font-size:24px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
.role-tank{--rc:#5f86a3}.role-fighter{--rc:#b06a48}.role-assassin{--rc:#7c6a9e}.role-mage{--rc:#3e98a1}.role-marksman{--rc:#bf9844}.role-support{--rc:#6c9d69}
.portrait.xl{width:220px;height:264px;border-radius:22px;font-size:112px}
.portrait.lg{width:84px;height:84px;font-size:38px;border-radius:16px}
.portrait.sm{width:32px;height:32px;font-size:15px;border-radius:8px}
.portrait.xs{width:24px;height:24px;font-size:11px;border-radius:6px}
.role-chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;border:1px solid var(--rc);color:#dfe9eb;background:rgba(9,17,21,.5)}

/* 타로 */
.spread{display:flex;justify-content:center;gap:clamp(10px,3.4vw,40px);margin:32px 0 8px}
.tarot{position:relative;flex:none;width:clamp(96px,26vw,196px);aspect-ratio:3/5;padding:0;border:0;background:none;perspective:1400px;transition:transform .35s,opacity .45s;border-radius:14px}
.tarot:hover:not(:disabled){transform:translateY(-10px)}
.tarot:disabled{cursor:default}
.tarot-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.75,.2,1)}
.tarot.flipped .tarot-inner{transform:rotateY(180deg)}
.tarot.chosen{transform:translateY(-6px)}
.tarot.dim{opacity:.26;transform:scale(.93)}
.face{position:absolute;inset:0;display:block;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.tb{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(214,178,106,.11) 0 1px,transparent 1px 13px),repeating-linear-gradient(-45deg,rgba(214,178,106,.11) 0 1px,transparent 1px 13px),linear-gradient(180deg,#14303a,#0a161b);box-shadow:inset 0 0 0 1px rgba(214,178,106,.7),inset 0 0 0 7px #0c1a1f,inset 0 0 0 8px rgba(214,178,106,.5)}
.tb .sigil{position:absolute;left:18%;right:18%;top:26%;color:var(--foil)}
.tb-mark{position:absolute;left:0;right:0;bottom:11%;text-align:center;font-family:var(--font-display);font-weight:800;color:var(--foil);letter-spacing:.32em;font-size:14px;padding-left:.32em}
.tf{position:absolute;inset:0;background:linear-gradient(180deg,#f3e9d1,#d7c393);color:#2b2213;box-shadow:inset 0 0 0 7px #efe3c5,inset 0 0 0 8px #8a6d33,0 0 50px rgba(240,220,170,.25)}
.tf-inner{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:center;padding:18px 12px 16px}
.tf.rev .tf-inner{transform:rotate(180deg)}
.tf-num{font-family:var(--font-display);font-weight:800;font-size:clamp(13px,3.4vw,17px);letter-spacing:.12em}
.tf-art{position:relative;width:100%;height:100%;display:grid;place-items:center;color:#7a5a22}
.tf-art .sigil{width:80%}
.tf-art .art{object-fit:contain}
.tf-name{font-family:var(--font-display);font-weight:800;font-size:clamp(14px,3.8vw,19px);text-align:center;line-height:1.2}
.reveal{max-width:660px;margin:22px auto 0;text-align:center}
.reveal h3{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,4vw,40px);margin:0;line-height:1.15}
.reveal-desc{color:#c3d2d5;margin:10px auto 0;max-width:34em}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 22px}

/* 챔피언 */
.champ-reveal{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;margin-top:30px}
.champ-name{font-family:var(--font-display);font-weight:900;font-size:clamp(44px,6vw,64px);margin:0;line-height:1.05}
.champ-title{margin:4px 0 0;color:var(--foil);font-family:var(--font-display);font-weight:600;font-size:18px}
.champ-desc{margin:12px 0 0;color:#c3d2d5;max-width:36em}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0;max-width:560px}
.stats div{padding:8px 12px;border-radius:10px;background:rgba(23,42,49,.7);border:1px solid rgba(228,238,240,.07)}
.stats dt{font-size:12px;color:var(--mist)}
.stats dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.skill{margin:0 0 22px;color:#c3d2d5;font-size:14px}
.skill b{color:var(--frost)}
.mini-head{font-size:13px;font-weight:600;color:var(--mist);margin:34px 0 10px;letter-spacing:.06em}
.ally-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ally{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(15,27,32,.82);border:1px solid rgba(228,238,240,.07)}
.ally small{display:block;color:var(--mist);font-size:12px}

.pick-title{color:var(--frost)}
.champ-select{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;margin-top:20px;align-items:start}
.role-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter{cursor:pointer;color:var(--mist)}
.filter[aria-pressed="true"]{border-color:var(--foil);color:#f2ddb0}
.champ-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.pick-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px 10px;border-radius:14px;background:rgba(15,27,32,.85);border:1px solid rgba(228,238,240,.08);text-align:center;transition:border-color .2s,transform .15s}
.pick-card:hover{border-color:rgba(214,178,106,.55);transform:translateY(-2px)}
.pick-card[aria-pressed="true"]{border-color:var(--foil);box-shadow:inset 0 0 0 1px var(--foil),0 0 28px -12px rgba(214,178,106,.7)}
.pick-card small{color:var(--mist);font-size:12px}
.champ-detail{position:sticky;top:76px;padding:20px;border-radius:18px;border:1px solid var(--line);background:rgba(15,27,32,.92);scroll-margin-top:72px}
.detail-head{display:flex;align-items:center;gap:16px}
.champ-detail .champ-name{font-size:38px}
.champ-detail .champ-desc{margin-top:12px;font-size:14px}
.champ-detail .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:14px 0}
.champ-detail .stats div{padding:5px 10px}
.champ-detail .skill{margin-bottom:16px}
.champ-detail .btn{width:100%}
@media (max-width:860px){.champ-select{grid-template-columns:1fr}.champ-detail{position:static;order:-1}}

/* 로딩 */
.loading-tarot{display:flex;justify-content:center;margin-top:24px}
.team{margin-top:18px}
.team h3{font-family:var(--font-display);font-weight:800;font-size:20px;margin:0 0 10px}
.team.ally-team h3{color:var(--tide)}
.team.enemy-team h3{color:var(--blood)}
.team-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.mini{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 10px 12px;border-radius:14px;background:rgba(15,27,32,.85);border:1px solid rgba(228,238,240,.07);text-align:center;min-width:0}
.ally-team .mini{border-top:2px solid var(--tide)}
.enemy-team .mini{border-top:2px solid var(--blood)}
.mini.me{box-shadow:inset 0 0 0 1px var(--foil),0 0 30px -12px rgba(214,178,106,.6)}
.mini b{font-size:15px}
.mini-augs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:30px}
.aug-names{margin:2px 0 0;padding:0;list-style:none;font-size:12px;color:#c3d2d5;line-height:1.45}
.vs{font-family:var(--font-display);font-weight:900;text-align:center;color:var(--foil);font-size:22px;letter-spacing:.3em;margin:18px 0 0;padding-left:.3em}
.go{display:flex;justify-content:center;margin-top:26px}

/* 전투 */
.battle{max-width:780px;margin:28px auto 0}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px}
.score .k{font-family:var(--font-display);font-weight:900;font-size:clamp(52px,9vw,80px);line-height:1;font-variant-numeric:tabular-nums}
.score .k.a{color:var(--tide);text-align:right}
.score .k.b{color:var(--blood)}
.clock{display:grid;justify-items:center;color:var(--mist);font-size:12px}
.clock b{font-size:22px;color:var(--frost);font-variant-numeric:tabular-nums;font-weight:600}
.score-names{display:grid;grid-template-columns:1fr 1fr;gap:120px;color:var(--mist);font-size:13px;margin-top:2px}
.score-names span:first-child{text-align:right}
.towers{display:grid;gap:8px;margin:20px 0 14px}
.tower-row{display:grid;grid-template-columns:72px repeat(6,1fr);align-items:center;gap:6px;font-size:12px;color:var(--mist)}
.pip{height:7px;border-radius:4px;background:var(--pc);transition:background .4s,opacity .4s}
.tower-row.ally-row-t{--pc:var(--tide)}
.tower-row.enemy-row-t{--pc:var(--blood)}
.pip.down{background:rgba(228,238,240,.1)}
.feed{list-style:none;margin:0;padding:12px 14px;height:min(420px,52vh);overflow:auto;border:1px solid var(--line);border-radius:14px;background:rgba(7,13,16,.78);display:flex;flex-direction:column;gap:7px}
.feed li{display:flex;align-items:center;gap:8px;font-size:14px;animation:feedin .28s ease both;flex-wrap:wrap}
@keyframes feedin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.feed .who{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.feed .ka{color:#a9dbe4}
.feed .kb{color:#f0a497}
.feed .verb{color:var(--mist);font-size:12px}
.feed .fb{font-size:11px;font-weight:700;color:#1b1407;background:var(--foil);border-radius:999px;padding:1px 8px}
.feed .fight{margin-top:6px;color:var(--foil);font-family:var(--font-display);font-weight:800;font-size:14px}
.feed .fight:first-child{margin-top:0}
.feed .end{color:#c3d2d5;font-size:13px;padding:4px 0 6px;border-bottom:1px dashed rgba(228,238,240,.1)}
.feed .note{color:#d9c79f;font-size:13px}
.feed .multi{font-family:var(--font-display);font-weight:900;font-size:18px;color:var(--foil)}
.battle .go{margin-top:16px}

/* 결과 */
.verdict{text-align:center;padding:30px 0 4px}
.verdict h2{font-family:var(--font-display);font-weight:900;font-size:clamp(76px,12vw,132px);margin:0;line-height:1}
.verdict.win h2{color:var(--tide);text-shadow:0 0 46px rgba(111,184,198,.38)}
.verdict.lose h2{color:var(--blood);text-shadow:0 0 46px rgba(212,107,92,.32)}
.verdict-sub{color:#c3d2d5;margin:10px 0 0;font-variant-numeric:tabular-nums}
.me-card{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:20px 22px;border:1px solid var(--line);border-radius:18px;background:rgba(15,27,32,.88);margin:24px 0}
.kda{font-family:var(--font-display);font-weight:900;font-size:34px;margin:0;line-height:1.1;font-variant-numeric:tabular-nums}
.kda .d{color:var(--blood)}
.me-sub{color:#c3d2d5;margin:6px 0 10px;font-size:14px;font-variant-numeric:tabular-nums}
.me-augs{display:flex;flex-wrap:wrap;gap:8px}
.aug-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border-radius:999px;border:1px solid var(--t-line);font-size:13px;background:rgba(9,17,21,.5)}
.aug-pill.tier-prism{border-color:rgba(184,166,255,.6)}
.build{margin:12px 0 0;font-size:14px;color:#c3d2d5}
.stars{color:var(--foil);letter-spacing:.12em;margin:0 6px}
.me-grade{display:grid;justify-items:center;gap:2px;min-width:110px}
.grade{font-family:var(--font-display);font-weight:900;font-size:76px;line-height:1;color:var(--foil)}
.me-grade small{color:var(--mist);font-weight:700;letter-spacing:.12em}
.board-wrap{overflow-x:auto;border:1px solid rgba(228,238,240,.08);border-radius:14px;background:rgba(9,17,21,.6)}
table.board{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:820px}
.board th{font-weight:600;color:var(--mist);text-align:left;padding:10px 12px;font-size:12px;border-bottom:1px solid rgba(228,238,240,.08);white-space:nowrap}
.board td{padding:8px 12px;border-bottom:1px solid rgba(228,238,240,.05);vertical-align:middle}
.board tr.team-row td{font-family:var(--font-display);font-weight:800;font-size:14px;padding-top:12px}
.board tr.team-row.a td{color:var(--tide)}
.board tr.team-row.b td{color:var(--blood)}
.board tr.p.a td:first-child{box-shadow:inset 3px 0 0 var(--tide)}
.board tr.p.b td:first-child{box-shadow:inset 3px 0 0 var(--blood)}
.board tr.me td{background:rgba(214,178,106,.08)}
.who-cell{display:flex;align-items:center;gap:8px;white-space:nowrap}
.badge{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--foil);color:#1b1407;letter-spacing:.04em}
.badge.ace{background:#b9c5cc}
.augs-cell{display:flex;gap:3px}
.bar{height:5px;width:110px;background:rgba(228,238,240,.08);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--tide)}
tr.b .bar i{background:var(--blood)}
.g{font-family:var(--font-display);font-weight:900;font-size:16px}
.g.top{color:var(--foil)}
.fights{margin:18px 0 0;border:1px solid rgba(228,238,240,.08);border-radius:14px;background:rgba(9,17,21,.6);padding:4px 16px}
.fights summary{cursor:pointer;padding:10px 0;font-weight:600}
.fights ol{margin:0 0 14px;padding-left:20px;display:grid;gap:6px;font-size:14px;color:#c3d2d5;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.copy-note{text-align:center;color:var(--mist);font-size:13px;min-height:1.6em;margin:10px 0 0}
.copy-box{display:block;width:100%;max-width:560px;margin:8px auto 0;min-height:120px;background:#0b1519;color:var(--frost);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px}

/* 데이터 창 */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(3,7,9,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal[hidden]{display:none}
.modal-card{width:min(940px,100%);max-height:min(90vh,920px);display:flex;flex-direction:column;background:#0d191e;border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px -20px #000}
.modal-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid rgba(228,238,240,.08)}
.modal-head h2{font-family:var(--font-display);font-weight:800;font-size:22px;margin:0}
.tabs{flex:none;display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid rgba(228,238,240,.06);overflow-x:auto}
.tab{padding:8px 14px;border:0;background:none;color:var(--mist);border-bottom:2px solid transparent;font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--frost);border-color:var(--foil)}
.modal-body{padding:18px 20px 26px;overflow:auto}
.data-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{padding:12px 14px;border-radius:12px;background:rgba(23,42,49,.62);border:1px solid rgba(228,238,240,.08);font-size:13px;color:var(--mist)}
.tile b{display:block;font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--frost);line-height:1.2}
.src{display:inline-block;font-size:11.5px;font-weight:700;color:var(--foil);margin-bottom:4px}
.drop{display:grid;justify-items:center;gap:8px;border:1.5px dashed rgba(214,178,106,.5);border-radius:14px;padding:22px;text-align:center;color:var(--mist);cursor:pointer;font-size:13.5px}
.drop b{color:var(--frost);font-size:15px}
.drop.over{background:rgba(214,178,106,.08)}
.notes,.warns{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px;font-size:13px}
.notes li{padding:7px 12px;border-radius:8px;background:rgba(111,184,198,.1);border-left:3px solid var(--tide)}
.warns li{padding:7px 12px;border-radius:8px;background:rgba(212,107,92,.1);border-left:3px solid var(--blood)}
.warns li span{color:var(--mist);margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.guide h3{font-family:var(--font-display);font-weight:800;font-size:19px;margin:22px 0 6px}
.guide h3:first-child{margin-top:0}
.guide p{margin:6px 0;color:#c3d2d5;max-width:62em}
.guide .tbl{overflow-x:auto}
.guide table,.bal table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 14px}
.guide th,.guide td,.bal th,.bal td{text-align:left;padding:7px 10px;border-bottom:1px solid rgba(228,238,240,.07);vertical-align:top}
.guide th,.bal th{color:var(--mist);font-weight:600;font-size:12px;white-space:nowrap}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:rgba(228,238,240,.08);padding:1px 6px;border-radius:5px;white-space:nowrap}
.bal-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.bal h3{font-family:var(--font-display);font-weight:800;font-size:17px;margin:18px 0 4px}
.progress{height:8px;border-radius:4px;background:rgba(228,238,240,.08);overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;width:0;background:var(--foil);transition:width .15s}
.wr{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.wr .bar{width:90px;margin:0;position:relative}
.wr .bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(228,238,240,.4)}
.pill{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.hot{background:rgba(212,107,92,.2);color:#f2a99c}
.pill.cold{background:rgba(111,184,198,.18);color:#a3d8e2}
.disclaimer{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 20px 34px;color:#6d848a;font-size:12px;line-height:1.75;border-top:1px solid rgba(228,238,240,.06)}
.disclaimer b{color:#93a9ae}

@media (max-width:860px){
  .title-screen{grid-template-columns:1fr;padding-top:30px;gap:10px}
  .showcase{height:330px}
  .showcase .aug-card{width:190px;min-height:260px}
  .champ-reveal{grid-template-columns:1fr;gap:20px}
  .ally-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .team-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .me-card{grid-template-columns:auto 1fr}
  .me-grade{grid-column:1/-1;grid-auto-flow:column;justify-content:start;align-items:baseline;gap:10px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .data-tiles,.bal-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .score-names{gap:60px}
}
@media (max-width:480px){
  .topbar{padding:10px 14px}
  .shell{padding:0 16px 28px}
  .fan-tag{font-size:11px}
  .record{display:none}
  .showcase .aug-card{width:156px;min-height:230px;padding:16px 14px}
  .showcase .aug-card h3{font-size:18px}
  .team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .portrait.xl{width:160px;height:192px;font-size:80px}
  .tower-row{grid-template-columns:56px repeat(6,1fr)}
}
@media (hover:none){.hint,.btn kbd{display:none}}
@media (max-width:480px){.tf-inner{padding:12px 8px 10px}.tb-mark{font-size:11px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="wind" aria-hidden="true"></canvas>
<header class="topbar">
  <div class="brand">
    <button class="logo" data-action="home" aria-label="메롤 처음 화면으로">메롤</button>
    <span class="fan-tag">리그 오브 레전드 팬게임</span>

</footer>
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><h2 id="modal-title">데이터 · 밸런스</h2><button class="btn small" id="modal-close" data-action="close-modal">닫기</button></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-load" data-action="tab" data-tab="load">불러오기</button>
      <button class="tab" role="tab" id="tab-guide" data-action="tab" data-tab="guide">작성 안내</button>
      <button class="tab" role="tab" id="tab-balance" data-action="tab" data-tab="balance">밸런스 측정</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<input type="file" id="file-input" multiple accept=".csv,.tsv,.txt,image/*" hidden>

  function ruleChips(m) {

    chips.push(`<span class="chip ${r.rerolls !== def.rerolls ? 'rule' : ''}">리롤 ${r.rerolls}번</span>`);
    chips.push(`<span class="chip ${r.choices !== def.choices ? 'rule' : ''}">선택지 ${r.choices}장</span>`);
    const w = r.weights; const tot = E.TIERS.reduce((s, k) => s + w[k], 0) || 1;

    if (r.tierLock) chips.push(`<span class="chip rule">모든 증강 ${esc(r.tierLock)}</span>`);

  function startPlayback() {
    stopPlayback();
    const m = app.match; const r = m.result; const d = app.data;
    const name = slot => d.champById[r.players[slot].champId];
    const queue = [];
    for (const f of r.fights) {
      queue.push({ kind: 'fight', f });
      for (const e of f.events) queue.push({ kind: 'ev', e, f });
      queue.push({ kind: 'end', f });
    }
    const step = Math.max(70, Math.min(240, 9500 / Math.max(1, queue.length)));
    const st = { a: 0, b: 0 };
    let i = 0;
    const feed = $('#feed');
    const push = html => { if (!feed) return; feed.insertAdjacentHTML('beforeend', html); feed.scrollTop = feed.scrollHeight; };
    const who = (slot, cls) => { const c = name(slot); return `<span class="who ${cls}">${portrait(c, 'xs')}${esc(c.name)}</span>`; };
    app.timer = setInterval(() => {
      if (app.screen !== 'battle') { stopPlayback(); return; }
      if (i >= queue.length) { stopPlayback(); setTimeout(() => { if (app.screen === 'battle') finishBattle(); }, 700); return; }
      const q = queue[i++];
      if (q.kind === 'fight') { push(`<li class="fight">${fmtTime(q.f.start)} · ${q.f.n}번째 한타</li>`); setClock(q.f.start); }
      else if (q.kind === 'ev') {
        const e = q.e;
        if (e.kind === 'kill') {
          const kt = r.players[e.killer].team;
          if (kt === 'A') st.a++; else st.b++;
          $('#ka') && ($('#ka').textContent = st.a); $('#kb') && ($('#kb').textContent = st.b);
          push(`<li>${who(e.killer, kt === 'A' ? 'ka' : 'kb')}<span class="verb">처치</span>${who(e.victim, kt === 'A' ? 'kb' : 'ka')}${e.first ? '<span class="fb">선취점</span>' : ''}</li>`);
          setClock(e.at);

        else if (e.kind === 'multi') push(`<li class="multi">${esc(name(e.slot).name)} ${multiLabel(e.count)}!</li>`);
      } else {
        const f = q.f;
        f.destroyed.forEach((n, k) => { const idx = f.lostAfter[f.loser] - f.destroyed.length + k; const pip = $(`#pip-${f.loser}-${idx}`); if (pip) pip.classList.add('down'); });

  function bindDrop() {
    const drop = $('#drop'); if (!drop) return;
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });

  async function handleFiles(list) {
    const files = Array.from(list || []); if (!files.length) return;
    const notes = []; let csvChanged = false; let imgCount = 0;
    for (const f of files) {
      if (/^image\//.test(f.type) || /\.(png|jpe?g|webp|gif)$/i.test(f.name)) {
        const k = f.name.toLowerCase();
        if (app.images.has(k)) URL.revokeObjectURL(app.images.get(k));
        app.images.set(k, URL.createObjectURL(f)); imgCount++;
        continue;
      }
      const text = E.decode(await f.arrayBuffer());
      const kind = E.detectKind(text);
      if (!kind) { notes.push(`${f.name}: 어떤 표인지 알 수 없어요. 첫 줄 열 이름(역할, 등급, 방향 중 하나)을 확인해 주세요.`); continue; }
      app.uploads[kind] = text; csvChanged = true;
      notes.push(`${f.name}: ${KIND_LABEL[kind]} 표로 불러왔어요.`);
    }
    if (imgCount) notes.push(`그림 ${imgCount}장을 붙였어요.`);
    if (csvChanged) {
      const saved = lsSet(LS_DATA, app.uploads);
      if (!saved) notes.push('이 브라우저에 표를 저장하지 못해서, 새로고침하면 샘플로 돌아가요.');
      rebuild();
      if (app.match) { stopPlayback(); app.match = null; app.screen = 'title'; notes.push('진행 중이던 판은 새 표로 다시 시작해야 해서 처음 화면으로 돌아갔어요.'); }
    }
    app.notes = notes;
    render(); renderModal();
  }

        ['<code>실버확률</code> <code>골드확률</code> <code>프리즘확률</code>', '등급이 나올 비중 (기본 40 · 40 · 20)', '<code>프리즘확률+25</code> <code>실버확률=0</code>'],
        ['<code>등급고정</code>', '모든 증강을 한 등급으로', '<code>등급고정=프리즘</code>'],
        ['<code>마지막등급</code> <code>N번째등급</code>', '특정 차례의 등급 확정', '<code>마지막등급=프리즘</code> <code>1번째등급=골드</code>'],
        ['<code>증강풀</code>', '풀 칸에 그 이름을 적은 특별 증강을 매 선택마다 1장 보장', '<code>증강풀=별빛 무대</code>'],
      ])}
      <h3>양식 복사</h3>
      <p>샘플 표를 복사해서 엑셀 A1 칸에 붙여 넣으면 열이 나뉘지 않을 수 있어요. 그럴 땐 메모장에 붙여 넣고 .csv로 저장한 뒤 엑셀로 여세요.</p>
      <div class="row">
        <button class="btn small" data-action="copy-template" data-kind="champions">캐릭터 양식 복사</button>
        <button class="btn small" data-action="copy-template" data-kind="augments">증강 양식 복사</button>
        <button class="btn small" data-action="copy-template" data-kind="tarot">타로 양식 복사</button>
      </div>
      <p class="copy-note" id="tpl-note" role="status"></p>
    </div>`;
  }

  function viewBalance() {
    const b = app.balance; const d = app.data;
    const pct = x => `${(x * 100).toFixed(1)}%`;
    const wrCell = o => { const w = o.w / o.n; return `<span class="wr">${pct(w)}<span class="bar"><i style="width:${(w * 100).toFixed(1)}%"></i></span></span>`; };
    const pill = (o, min) => { if (o.n < min) return '<span class="pill">표본 적음</span>'; const w = o.w / o.n; return w >= 0.56 ? '<span class="pill hot">강함</span>' : w <= 0.44 ? '<span class="pill cold">약함</span>' : ''; };
    const table = (title, entries, nameOf, min, note) => {
      const rows = entries.sort((x, y) => y[1].w / y[1].n - x[1].w / x[1].n).map(([k, o]) => `<tr><td>${nameOf(k)}</td><td>${fmtNum(o.n)}</td><td>${wrCell(o)}</td><td>${pill(o, min)}</td></tr>`).join('');
      return `<h3>${title}</h3>${note ? `<p class="muted">${note}</p>` : ''}<div class="tbl"><table><thead><tr><th>이름</th><th>표본</th><th>승률</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
    };
    let out = `<div class="bal">
      <p class="muted">컴퓨터끼리 여러 판을 붙여서 승률을 봅니다. 50%에 가까울수록 고르게 맞춰진 거예요. 증강은 그 증강을 가진 챔피언 팀의 승률이라, 팀 전체에 거는 증강일수록 높게 나와요.</p>
      <div class="row">
        <button class="btn" data-action="run-balance" data-n="300"${b && b.running ? ' disabled' : ''}>300판 돌리기</button>
        <button class="btn primary" data-action="run-balance" data-n="1000"${b && b.running ? ' disabled' : ''}>1000판 돌리기</button>
      </div>`;
    if (b) out += `<div class="progress"><i id="bal-progress" style="width:${(b.done / b.n * 100).toFixed(1)}%"></i></div><p class="muted" id="bal-count">${b.running ? `${fmtNum(b.done)} / ${fmtNum(b.n)}판 진행 중` : `${fmtNum(b.n)}판 완료`}</p>`;
    if (b && b.report) {
      const r = b.report;
      out += `<div class="bal-tiles">
        <div class="tile"><b>${fmtNum(r.n)}</b>판</div>
        <div class="tile"><b>${fmtTime(r.avgLen)}</b>평균 경기 시간</div>
        <div class="tile"><b>${r.avgKills.toFixed(1)}</b>평균 킬 (양 팀 합)</div>
        <div class="tile"><b>${pct(r.sideA)}</b>플레이어 팀 승률</div>
      </div>`;
      out += table('역할군', Object.entries(r.role), k => esc(k), 50);
      out += table('캐릭터', Object.entries(r.champ), k => esc(d.champById[k]?.name || k), 40);
      out += table('증강', Object.entries(r.aug), k => { const a = d.augById[k]; return a ? `<span class="who-cell">${augIcon(a, 'xs')}${esc(a.name)} <span class="muted">${esc(a.tier)}</span></span>` : esc(k); }, 40);
      if (Object.keys(r.tarot).length) out += table('타로 (플레이어 팀 승률)', Object.entries(r.tarot), k => { const t = d.tarotById[k]; return t ? `${esc(t.numeral)} ${esc(t.name)} · ${dirLabel(t)}` : esc(k); }, 30, '한쪽 팀만 강해지는 카드는 50%에서 벗어나는 게 정상이에요.');
    }
    return out + '</div>';
  }
  function runBalance(n) {
    if (app.balance && app.balance.running) return;
    const seed0 = (Date.now() >>> 0); const ms = []; let i = 0;
    app.balance = { running: true, n, done: 0, report: null };
    renderModal();
    const step = () => {
      const end = Math.min(n, i + 25);
      for (; i < end; i++) ms.push(E.autoMatch(app.data, (seed0 + i * 7919) >>> 0));
      app.balance.done = i;
      if (i < n) {
        const bar = $('#bal-progress'); if (bar) bar.style.width = `${(i / n * 100).toFixed(1)}%`;
        const cnt = $('#bal-count'); if (cnt) cnt.textContent = `${fmtNum(i)} / ${fmtNum(n)}판 진행 중`;
        setTimeout(step, 0);
      } else {
        app.balance.running = false;
        app.balance.report = E.balanceReport(app.data, ms);
        if (app.modal === 'balance') renderModal();
      }
    };
    setTimeout(step, 30);
  }

  // ───── 클릭 ─────
  const actions = {
    start: () => newGame(),
    again: () => newGame(),
    home: () => { stopPlayback(); app.match = null; go('title'); },
    flip: (b) => {
      const m = app.match; if (!m || m.tarotPicked != null) return;
      const idx = Number(b.dataset.i);
      document.querySelectorAll('.tarot').forEach((el, i) => { el.disabled = true; el.classList.add(i === idx ? 'flipped' : 'dim'); if (i === idx) el.classList.add('chosen'); });
      E.chooseTarot(m, app.data, idx);
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(() => {
        if (app.match !== m || app.screen !== 'tarot') return;
        const rv = $('#reveal'); const t = app.data.tarotById[m.tarotId];
        if (rv && t) { rv.innerHTML = revealPanel(t, m); rv.classList.add('deal'); }
      }, reduce ? 0 : 950);
    },
    'to-champ': () => go('champ'),
    'to-augments': () => { if (app.match.champChosen === false) return; E.startRound(app.match, app.data); app.fresh = 'all'; go('augment'); },
    'choose-champ': (b) => chooseChamp(b.dataset.id),
    'random-champ': () => { const list = app.data.champions; chooseChamp(list[Math.floor(Math.random() * list.length)].id); },
    'role-filter': (b) => { app.roleFilter = b.dataset.role; render(); },
    pick: (b) => doPick(b.dataset.id),
    reroll: (b) => { const i = Number(b.dataset.i); if (E.rerollCard(app.match, app.data, i)) { app.fresh = i; render(); } },
    fight: () => { app.match.result = E.simulate(app.match, app.data); go('battle'); startPlayback(); },
    skip: () => finishBattle(),
    'copy-result': () => copyText(resultText(), 'copy-note'),
    'open-data': () => { if (isDev()) openModal(app.modal || 'load'); },
    'close-modal': () => closeModal(),
    tab: (b) => { app.modal = b.dataset.tab; renderModal(); },
    'clear-uploads': () => {
      app.uploads = {}; lsSet(LS_DATA, {}); app.notes = ['올린 표를 지웠어요. 샘플 데이터로 돌아갑니다.'];
      rebuild(); stopPlayback(); app.match = null; app.screen = 'title'; render(); renderModal();
    },
    'copy-template': (b) => copyText(embedded(`csv-${b.dataset.kind}`), 'tpl-note'),
    'run-balance': (b) => runBalance(Number(b.dataset.n)),
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    if (b.id === 'modal' && e.target !== b) return;
    const fn = actions[b.dataset.action];
    if (fn) fn(b, e);
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  $('#file-input').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && app.modal) { closeModal(); return; }
    if (app.modal) return;
    if (app.screen === 'augment' && /^[1-9]$/.test(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const id = app.match && app.match.offer && app.match.offer.ids[Number(e.key) - 1];
      if (id) doPick(id);
    }
  });
  // 그림: 불러오면 보이고, 없으면 글자 자리 표시를 그대로 둠
  document.addEventListener('load', e => { const t = e.target; if (t && t.classList && t.classList.contains('art')) t.classList.add('ok'); }, true);
  document.addEventListener('error', e => { const t = e.target; if (t && t.classList && t.classList.contains('art')) t.remove(); }, true);

  // ───── 칼바람 ─────
  function wind() {
    const cv = $('#wind'); const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w = 0, h = 0, dpr = 1;
    const size = () => { dpr = Math.min(2, window.devicePixelRatio || 1); w = cv.width = Math.floor(innerWidth * dpr); h = cv.height = Math.floor(innerHeight * dpr); };
    size(); addEventListener('resize', size);
    const ps = Array.from({ length: 80 }, () => ({ x: Math.random(), y: Math.random(), r: 0.5 + Math.random() * 1.5, s: 0.0003 + Math.random() * 0.0012, a: 0.1 + Math.random() * 0.35, ph: Math.random() * 6.28 }));
    const draw = tt => {
      ctx.clearRect(0, 0, w, h);
      for (const p of ps) {
        if (!reduce) {
          p.x += p.s * 1.7; p.y += p.s * 0.45 + Math.sin(tt / 1500 + p.ph) * 0.00025;
          if (p.x > 1.05) { p.x = -0.05; p.y = Math.random(); }
          if (p.y > 1.05) p.y = -0.05;
        }
        ctx.globalAlpha = p.a;
        ctx.strokeStyle = '#d9eef2'; ctx.lineWidth = p.r * dpr; ctx.lineCap = 'round';
        const len = p.s * 9000 * dpr;
        ctx.beginPath(); ctx.moveTo(p.x * w, p.y * h); ctx.lineTo(p.x * w - len, p.y * h - len * 0.26); ctx.stroke();
      }
      if (!reduce && !document.hidden) requestAnimationFrame(draw);
    };
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !reduce) requestAnimationFrame(draw); });
    requestAnimationFrame(draw);
  }

  // ───── 시작 ─────
  function validMatch(m) {
    const d = app.data;
    return m && Array.isArray(m.slots) && m.slots.length === 10 && m.slots.every(s => d.champById[s.champId] && s.augIds.every(id => d.augById[id])) && (!m.tarotId || d.tarotById[m.tarotId]);
  }
  // 개발자 창은 주소 끝에 #dev 를 붙였을 때만 보임
  const isDev = () => location.hash === '#dev';
  function syncDev() {
    $('#btn-data').hidden = !isDev();
    if (!isDev() && app.modal) { app.modal = null; $('#modal').hidden = true; }
  }
  addEventListener('hashchange', syncDev);
  function start(saved) {
    app.uploads = lsGet(LS_DATA, {}) || {};
    rebuild();
    if (saved && saved.match && validMatch(saved.match)) {
      app.match = saved.match;
      app.screen = saved.screen === 'battle' ? 'result' : saved.screen;
      if (app.screen === 'augment' && !app.match.offer) app.screen = 'loading';
      if (app.screen === 'result' && !app.match.result) app.screen = 'loading';
    }
    render();
    syncDev();
    wind();
    tryFolder();
  }
  window.claude?.hot?.snapshot?.(() => ({ screen: app.screen, match: app.match }));
  if (window.claude?.hot?.ready) window.claude.hot.ready(start);
  else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
